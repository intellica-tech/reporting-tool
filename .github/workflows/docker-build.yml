name: Build and Push Reporting Tool Docker Image

on:
  push:
    branches:
      - main-dnext
  pull_request:
    branches:
      - main-dnext

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/reporting-tool:latest
            ghcr.io/${{ github.repository_owner }}/reporting-tool:${{ github.sha }}

      - name: Verify Image
        run: docker images ghcr.io/${{ github.repository_owner }}/reporting-tool
